spring.application.name=notepilot
server.port=8080

# HF_TOKEN is read from the environment in AiService (@Value("${HF_TOKEN}")). Never put a real token here.

notepilot.ai.model=deepseek-ai/DeepSeek-V4.1-Flash
# Reasoning tokens count against this limit. Too small => content:null, finish_reason:length.
notepilot.ai.max-tokens=8000
# Optional. Leave empty to omit. If your provider supports it, try: low
notepilot.ai.reasoning-effort=
